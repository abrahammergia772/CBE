# Render Blueprint — CBE Care static site
# Import this instead of filling the form by hand:
#   Render Dashboard → New → Blueprint → select this repo
services:
  - type: web
    name: cbe-care
    runtime: static

    # devDependencies must be installed explicitly: vite lives there and
    # Render may set NODE_ENV=production, which would otherwise skip it.
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist

    envVars:
      # Vite 8 requires ^20.19.0 || >=22.12.0
      - key: NODE_VERSION
        value: 20.19.0

    # The app uses HashRouter, so this is belt-and-braces — it also keeps
    # any future BrowserRouter deep links working on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
